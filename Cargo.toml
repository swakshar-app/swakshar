[workspace]
resolver = "3"
members = [
  "crates/protocol",
  "crates/cms",
  "crates/token",
  "crates/tls",
  "crates/server",
  "crates/cli",
  "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swakshar-app/swakshar"
publish = false

# Exact pins only. Every version was at least seven days old when pinned.
[workspace.dependencies]
swakshar-cms = { path = "crates/cms" }
swakshar-protocol = { path = "crates/protocol" }
swakshar-server = { path = "crates/server" }
swakshar-tls = { path = "crates/tls" }
swakshar-token = { path = "crates/token" }

base64 = "=0.22.1"
cms = "=0.2.3"
const-oid = { version = "=0.9.6", features = ["db"] }
cryptoki = "=0.12.1"
der = { version = "=0.7.10", features = ["alloc", "derive", "oid", "std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
log = "=0.4.34"
rcgen = "=0.14.10"
ring = "=0.17.14"
rpassword = "=7.5.4"
rustls = { version = "=0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
spki = "=0.7.3"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["std"] }
tokio = { version = "=1.53.1", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
x509-cert = "=0.2.5"
zeroize = "=1.9.0"

tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-log = "=2.9.1"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
