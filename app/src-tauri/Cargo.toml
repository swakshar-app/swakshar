[package]
name = "swakshar-app"
description = "Swakshar desktop app: menu bar signer, approval window, guided setup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "swakshar-app"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
swakshar-protocol = { workspace = true }
swakshar-server = { workspace = true }
swakshar-tls = { workspace = true }
swakshar-token = { workspace = true }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }

[lints]
workspace = true
