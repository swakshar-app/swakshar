name: Signing failed on the GST portal
description: The portal could not reach Swakshar, rejected a signature, or showed an error while signing.
labels: ["portal"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a PAN, a name, a token or certificate serial, a certificate or a PIN.** This page is public. Mask the PAN in anything you copy from the portal (for example ABCDE****F).
  - type: dropdown
    id: filing
    attributes:
      label: What were you signing?
      options:
        - DSC registration or update
        - A GST return (GSTR-1, GSTR-3B and so on)
        - Another form or refund
        - Not sure
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Exact portal message
      description: Copy the words the portal showed, for example "Failed to establish connection to the server" or "Signing Cancelled".
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it stop?
      options:
        - The portal never reached Swakshar (no approval window)
        - The approval window opened, then signing failed
        - Swakshar signed, then the portal rejected the signature
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Swakshar version, macOS version, browser
      placeholder: "0.1.0, macOS 26.3 on Apple silicon, Chrome 142"
    validations:
      required: true
  - type: input
    id: token
    attributes:
      label: Token model and Certifying Authority
      placeholder: "HYP2003 from XtraTrust"
  - type: input
    id: when
    attributes:
      label: Date and time it happened (IST)
      description: Helps match a portal change.
  - type: textarea
    id: frames
    attributes:
      label: DevTools frames (optional)
      description: In the browser, open DevTools, Network, the 127.0.0.1 row, Messages. Mask the PAN and cut the long signature down to its first 40 characters.
      render: text
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: In Swakshar, Help, Report a problem, Create diagnostic report, Copy report. Read it before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no unmasked PAN, name, serial, certificate or PIN.
          required: true
