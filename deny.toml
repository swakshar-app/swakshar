# cargo-deny policy: known advisories, licences, and where crates may come from.
[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail at any depth. Unmaintained crates fail only when we
# depend on them directly; deeper ones belong to Tauri and gtk-rs to replace.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# Mozilla's root certificate list, which the updater's HTTPS client trusts.
exceptions = [
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates reach each other by path; all are publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
